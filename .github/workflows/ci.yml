# Runs the suite on every pull request and every push to main.
#
# Until now the only workflow here was publish.yml, which fires on a release
# tag — so nothing checked a merge until someone cut a release from it.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push to a PR makes the first run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor package.json claims, and the version publish.yml ships
        # from. Anything in between is interpolation; those two are promises.
        node: ['18', '22']
    steps:
      - uses: actions/checkout@v5

      # This pack ships Ruby check scripts. The suite parses every one of
      # them with `ruby -c` and runs one for real against a vendored install,
      # so a Node-only runner would happily green-light a suite that never
      # executed the thing being published. The checks need stdlib only
      # (json, optparse) — no Bundler, no gems.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm test
